<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weekly Quiz — AgenticEd</title>
  <meta name="description" content="Check your understanding of each AgenticEd week with a short scored quiz — every answer comes with an explanation."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--cream:#FAF3E8;--brown:#1E1108;--coral:#E8654A;--coral-light:#FDF0EC;--amber:#F5A623;--warm:#7A6652;--border:#E0D3C3;--white:#FFFFFF;--light:#F2EAD8;--good:#2E7D57;--good-bg:#DBEBE0;--bad:#C0392B;--bad-bg:#F9E2DE;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:var(--cream);color:var(--brown);line-height:1.7;-webkit-font-smoothing:antialiased;}
    .topbar{background:var(--brown);padding:10px 32px;display:flex;justify-content:space-between;align-items:center;}
    .topbar__logo{font-family:'Outfit',sans-serif;font-weight:900;font-size:16px;color:var(--cream);text-decoration:none;}
    .topbar__logo em{font-style:normal;color:var(--coral);}
    .topbar a.back{color:rgba(250,243,232,0.6);font-size:13px;text-decoration:none;}
    .topbar a.back:hover{color:var(--cream);}
    .lhdr{background:var(--brown);padding:40px 32px 44px;border-bottom:3px solid var(--coral);}
    .lhdr__inner{max-width:780px;margin:0 auto;}
    .lhdr__eye{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-bottom:12px;}
    .lhdr__h1{font-family:'Outfit',sans-serif;font-size:clamp(26px,5vw,40px);font-weight:900;color:var(--cream);line-height:1.15;margin-bottom:12px;}
    .lhdr__sub{font-size:15px;color:rgba(250,243,232,0.72);max-width:620px;}
    .body{max-width:780px;margin:0 auto;padding:34px 32px 80px;}
    .picker{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px;}
    .pick{font-size:13px;font-weight:700;color:var(--warm);background:var(--white);border:1px solid var(--border);border-radius:999px;padding:7px 15px;text-decoration:none;transition:all .15s;}
    .pick:hover{border-color:var(--coral);color:var(--brown);}
    .pick--on{background:var(--brown);color:var(--cream);border-color:var(--brown);}
    .pick--done{border-color:var(--good);color:var(--good);}
    .q{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:22px 24px;margin-bottom:16px;}
    .q__n{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--coral);margin-bottom:6px;}
    .q__text{font-size:16px;font-weight:600;margin-bottom:14px;}
    .opt{display:flex;gap:11px;align-items:flex-start;background:var(--cream);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:border-color .14s,background .14s;font-size:15px;}
    .opt:hover{border-color:var(--coral);}
    .opt input{margin-top:5px;accent-color:var(--coral);}
    .opt--sel{border-color:var(--coral);background:var(--coral-light);}
    .q--graded .opt{cursor:default;pointer-events:none;}
    .opt--right{border-color:var(--good)!important;background:var(--good-bg)!important;}
    .opt--wrong{border-color:var(--bad)!important;background:var(--bad-bg)!important;}
    .why{display:none;margin-top:10px;background:#FFFBEF;border-left:4px solid var(--amber);border-radius:0 8px 8px 0;padding:12px 16px;font-size:14px;color:var(--brown);}
    .why b{color:#996600;}
    .q--graded .why{display:block;}
    .submit-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:24px;}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;border:2px solid transparent;font-family:'Inter',sans-serif;transition:all .18s;text-decoration:none;}
    .btn--primary{background:var(--coral);color:#fff;}
    .btn--primary:hover{background:#d04e38;}
    .btn--ghost{background:transparent;color:var(--brown);border:2px solid var(--border);}
    .btn--ghost:hover{border-color:var(--brown);}
    .score{display:none;background:var(--brown);border-radius:16px;padding:28px 30px;margin:26px 0 6px;}
    .score__n{font-family:'Outfit',sans-serif;font-size:38px;font-weight:900;color:var(--cream);line-height:1;}
    .score__n em{font-style:normal;color:var(--coral);}
    .score__msg{font-size:15px;color:rgba(250,243,232,0.78);margin-top:8px;}
    .score__next{margin-top:16px;}
    .best{font-size:13px;color:var(--warm);margin-bottom:20px;}
    .best b{color:var(--good);}
    .lesson-footer{background:var(--brown);padding:24px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
    .lesson-footer a{color:rgba(250,243,232,0.5);font-size:13px;text-decoration:none;}
    .lesson-footer a:hover{color:var(--cream);}
    .lesson-footer__logo{font-family:'Outfit',sans-serif;font-weight:900;font-size:16px;color:var(--cream);}
    .lesson-footer__logo em{font-style:normal;color:var(--coral);}
    @media(max-width:700px){.body{padding:24px 16px 60px;}.lhdr{padding:30px 20px 34px;}}
  </style>
</head>
<body>
<div class="topbar">
  <a href="index.html" class="topbar__logo">Agent<em>Edu</em></a>
  <a href="index.html" class="back">← Back to Course</a>
</div>
<div class="lhdr">
  <div class="lhdr__inner">
    <p class="lhdr__eye">Check Your Understanding</p>
    <h1 class="lhdr__h1" id="title">Weekly Quiz</h1>
    <p class="lhdr__sub">Answer every question, then submit — you'll get your score and a short "why" for each answer. Retake as often as you like; your best score is saved in this browser.</p>
  </div>
</div>
<div class="body">
  <div class="picker" id="picker"></div>
  <p class="best" id="best"></p>
  <div id="quiz"></div>
  <div class="submit-row">
    <button class="btn btn--primary" id="grade">Check my answers</button>
    <button class="btn btn--ghost" id="retake" style="display:none;">Retake quiz</button>
  </div>
  <div class="score" id="score">
    <div class="score__n" id="score-n"></div>
    <p class="score__msg" id="score-msg"></p>
    <div class="score__next" id="score-next"></div>
  </div>
</div>
<div class="lesson-footer">
  <a href="index.html" class="lesson-footer__logo">Agent<em>Edu</em></a>
  <div style="display:flex;gap:20px;">
    <a href="index.html">← Back to Course</a>
    <a href="assessment.html">Course Assessment</a>
    <a href="glossary.html">Glossary</a>
  </div>
</div>
<script src="quizzes.js"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var params=new URLSearchParams(location.search);
  var wk=parseInt(params.get("week"),10);
  if(!(wk>=1&&wk<=6)) wk=1;
  var bank=window.AGENTICED_QUIZ.weeks[wk];
  var KEY="agenticed:quiz:week"+wk;

  // Week picker with done-state
  var pickerHtml="";
  for(var i=1;i<=6;i++){
    var cls="pick"+(i===wk?" pick--on":"");
    try{
      var rec=JSON.parse(localStorage.getItem("agenticed:quiz:week"+i)||"null");
      if(rec&&i!==wk&&rec.best>=Math.ceil(window.AGENTICED_QUIZ.weeks[i].questions.length*0.7)) cls+=" pick--done";
    }catch(e){}
    pickerHtml+='<a class="'+cls+'" href="quiz.html?week='+i+'">Week '+i+'</a>';
  }
  $("picker").innerHTML=pickerHtml;
  $("title").textContent=bank.title+" — Quiz";
  document.title=bank.title+" Quiz — AgenticEd";

  function showBest(){
    try{
      var rec=JSON.parse(localStorage.getItem(KEY)||"null");
      $("best").innerHTML=rec?("Your best score so far: <b>"+rec.best+" / "+bank.questions.length+"</b> ("+rec.attempts+" attempt"+(rec.attempts>1?"s":"")+")"):"First attempt — good luck!";
    }catch(e){$("best").textContent="";}
  }
  showBest();

  function render(){
    var html="";
    bank.questions.forEach(function(item,qi){
      html+='<div class="q" id="q'+qi+'"><div class="q__n">Question '+(qi+1)+' of '+bank.questions.length+'</div>'+
        '<div class="q__text">'+item.q+'</div>';
      item.opts.forEach(function(opt,oi){
        html+='<label class="opt" data-q="'+qi+'" data-o="'+oi+'"><input type="radio" name="q'+qi+'" value="'+oi+'"/><span>'+opt+'</span></label>';
      });
      html+='<div class="why"><b>Why:</b> '+item.why+'</div></div>';
    });
    $("quiz").innerHTML=html;
    Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(lab){
      lab.addEventListener("click",function(){
        var q=lab.dataset.q;
        Array.prototype.forEach.call(document.querySelectorAll('.opt[data-q="'+q+'"]'),function(x){x.classList.remove("opt--sel");});
        lab.classList.add("opt--sel");
      });
    });
    $("score").style.display="none";
    $("grade").style.display="";
    $("retake").style.display="none";
    window.scrollTo({top:0});
  }
  render();

  $("grade").addEventListener("click",function(){
    var unanswered=[];
    bank.questions.forEach(function(_,qi){
      if(!document.querySelector('input[name="q'+qi+'"]:checked')) unanswered.push(qi+1);
    });
    if(unanswered.length){alert("Answer every question first — missing: "+unanswered.join(", "));return;}
    var right=0;
    bank.questions.forEach(function(item,qi){
      var chosen=parseInt(document.querySelector('input[name="q'+qi+'"]:checked').value,10);
      var qEl=$("q"+qi);
      qEl.classList.add("q--graded");
      Array.prototype.forEach.call(qEl.querySelectorAll(".opt"),function(lab){
        var oi=parseInt(lab.dataset.o,10);
        if(oi===item.a) lab.classList.add("opt--right");
        else if(oi===chosen) lab.classList.add("opt--wrong");
      });
      if(chosen===item.a) right++;
    });
    var total=bank.questions.length;
    var pct=right/total;
    $("score-n").innerHTML=right+" <em>/ "+total+"</em>";
    $("score-msg").textContent=pct===1?"Perfect — you own this week's concepts.":pct>=0.7?"Solid — review the explanations on anything you missed, then move on.":"Worth a revisit: reread the explanations below, skim the week page, and retake.";
    var nextWk=wk<6?wk+1:null;
    $("score-next").innerHTML=(pct>=0.7&&nextWk?'<a class="btn btn--primary" href="week'+nextWk+'.html">Continue to Week '+nextWk+' →</a>':(pct>=0.7&&!nextWk?'<a class="btn btn--primary" href="assessment.html?mode=final">Take the final assessment →</a>':'<a class="btn btn--ghost" style="border-color:rgba(250,243,232,.35);color:var(--cream);" href="week'+wk+'.html">Review Week '+wk+' →</a>'));
    $("score").style.display="block";
    $("grade").style.display="none";
    $("retake").style.display="";
    try{
      var rec=JSON.parse(localStorage.getItem(KEY)||"null")||{best:0,attempts:0};
      rec.attempts++;
      rec.best=Math.max(rec.best,right);
      rec.total=total;
      rec.last=right;
      rec.when=Date.now();
      localStorage.setItem(KEY,JSON.stringify(rec));
    }catch(e){}
    showBest();
    $("score").scrollIntoView({behavior:"smooth",block:"center"});
  });
  $("retake").addEventListener("click",render);
})();
</script>
</body>
</html>
