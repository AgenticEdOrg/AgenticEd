<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Certification Exam — AgenticEd Certifications</title>
  <meta name="description" content="Take an AgenticEd certification exam — 20 questions, 70% to pass, instant scoring with explanations."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="certifications.css"/>
  <style>
    .status{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:24px;font-size:14px;color:var(--warm);}
    .status b{color:var(--brown);}
    .q{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:22px 24px;margin-bottom:16px;}
    .q__n{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--coral);margin-bottom:6px;display:flex;justify-content:space-between;}
    .q__type{color:var(--warm);font-weight:600;letter-spacing:0;text-transform:none;}
    .q__text{font-size:16px;font-weight:600;margin-bottom:14px;}
    .opt{display:flex;gap:11px;align-items:flex-start;background:var(--cream);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:border-color .14s,background .14s;font-size:15px;}
    .opt:hover{border-color:var(--coral);}
    .opt input{margin-top:5px;accent-color:var(--coral);}
    .opt--sel{border-color:var(--coral);background:var(--coral-light);}
    .q--graded .opt{cursor:default;pointer-events:none;}
    .opt--right{border-color:var(--good)!important;background:var(--good-bg)!important;}
    .opt--wrong{border-color:var(--bad)!important;background:var(--bad-bg)!important;}
    .why{display:none;margin-top:10px;background:#FFFBEF;border-left:4px solid var(--amber);border-radius:0 8px 8px 0;padding:12px 16px;font-size:14px;color:var(--brown);}
    .why b{color:#996600;}
    .q--graded .why{display:block;}
    .submit-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:24px;}
    .score{display:none;background:var(--brown);border-radius:16px;padding:28px 30px;margin:26px 0 6px;}
    .score__n{font-family:'Outfit',sans-serif;font-size:38px;font-weight:900;color:var(--cream);line-height:1;}
    .score__n em{font-style:normal;color:var(--coral);}
    .score__msg{font-size:15px;color:rgba(250,249,255,0.78);margin-top:10px;}
    .score__next{margin-top:18px;}
  </style>
  <script src="cert-data.js"></script>
</head>
<body>
<div class="topbar">
  <a href="index.html" class="topbar__logo">AgenticEd <em>Certifications</em></a>
  <a href="index.html" class="back">← All certifications</a>
</div>
<div class="lhdr">
  <div class="lhdr__inner">
    <p class="lhdr__eye" id="eye">Certification Exam</p>
    <h1 class="lhdr__h1" id="title">Exam</h1>
    <p class="lhdr__sub">Answer every question, then submit. You need 70% (14/20) to pass. Some questions ask you to select all that apply.</p>
  </div>
</div>
<div class="body">
  <div class="status" id="status"></div>
  <div id="quiz"></div>
  <div class="submit-row">
    <button class="btn btn--primary" id="grade">Submit exam</button>
    <button class="btn btn--ghost" id="retake" style="display:none;">Retake exam</button>
  </div>
  <div class="score" id="score">
    <div class="score__n" id="score-n"></div>
    <p class="score__msg" id="score-msg"></p>
    <div class="score__next" id="score-next"></div>
  </div>
</div>
<div class="lesson-footer">
  <a href="index.html" class="lesson-footer__logo">AgenticEd <em>Certifications</em></a>
  <div style="display:flex;gap:20px;">
    <a href="index.html">← All certifications</a>
    <a href="mailto:hello@agenticed.org">hello@agenticed.org</a>
  </div>
</div>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var certs=window.AGENTICED_CERTS;
  var params=new URLSearchParams(location.search);
  var levelId=params.get("level");
  if(!certs.levels[levelId]) levelId=certs.order[0];
  var lvl=certs.levels[levelId];
  var KEY="agenticed_certs:exam:"+levelId;

  document.title=lvl.name+" Exam — AgenticEd Certifications";
  $("eye").textContent=lvl.tier+" Certification Exam";
  $("title").textContent=lvl.name;

  function getRec(){try{return JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){return null;}}
  function showStatus(){
    var rec=getRec();
    $("status").innerHTML=rec
      ?"Your best attempt: <b>"+rec.best+" / "+lvl.total+"</b> ("+rec.attempts+" attempt"+(rec.attempts>1?"s":"")+"). Passing score is <b>"+lvl.passScore+" / "+lvl.total+"</b>."
      :"First attempt on this exam. Passing score is <b>"+lvl.passScore+" / "+lvl.total+"</b> (70%).";
  }
  showStatus();

  function render(){
    var html="";
    lvl.questions.forEach(function(item,qi){
      var isMulti=item.type==="multi";
      html+='<div class="q" id="q'+qi+'"><div class="q__n"><span>Question '+(qi+1)+' of '+lvl.questions.length+'</span>'+
        (isMulti?'<span class="q__type">Select all that apply</span>':'<span class="q__type">Select one</span>')+'</div>'+
        '<div class="q__text">'+item.q+'</div>';
      item.opts.forEach(function(opt,oi){
        var inputType=isMulti?"checkbox":"radio";
        html+='<label class="opt" data-q="'+qi+'" data-o="'+oi+'"><input type="'+inputType+'" name="q'+qi+(isMulti?"_"+oi:"")+'" value="'+oi+'"/><span>'+opt+'</span></label>';
      });
      html+='<div class="why"><b>Why:</b> '+item.why+'</div></div>';
    });
    $("quiz").innerHTML=html;
    Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(lab){
      lab.addEventListener("click",function(){
        var input=lab.querySelector("input");
        if(input.type==="radio"){
          Array.prototype.forEach.call(document.querySelectorAll('.opt[data-q="'+lab.dataset.q+'"]'),function(x){x.classList.remove("opt--sel");});
          lab.classList.add("opt--sel");
        } else {
          lab.classList.toggle("opt--sel",input.checked);
        }
      });
    });
    $("score").style.display="none";
    $("grade").style.display="";
    $("retake").style.display="none";
    window.scrollTo({top:0});
  }
  render();

  function selectedIndices(qi,isMulti){
    if(isMulti){
      var boxes=document.querySelectorAll('.q#q'+qi+' input[type="checkbox"]:checked');
      return Array.prototype.map.call(boxes,function(b){return parseInt(b.value,10);}).sort(function(a,b){return a-b;});
    }
    var r=document.querySelector('input[name="q'+qi+'"]:checked');
    return r?parseInt(r.value,10):null;
  }
  function sameSet(a,b){
    if(a.length!==b.length)return false;
    for(var i=0;i<a.length;i++) if(a[i]!==b[i]) return false;
    return true;
  }

  $("grade").addEventListener("click",function(){
    var unanswered=[];
    lvl.questions.forEach(function(item,qi){
      var isMulti=item.type==="multi";
      var chosen=selectedIndices(qi,isMulti);
      if(isMulti ? chosen.length===0 : chosen===null) unanswered.push(qi+1);
    });
    if(unanswered.length){alert("Answer every question first — missing: "+unanswered.join(", "));return;}

    var right=0;
    lvl.questions.forEach(function(item,qi){
      var isMulti=item.type==="multi";
      var chosen=selectedIndices(qi,isMulti);
      var correct=isMulti?sameSet(chosen,item.a.slice().sort(function(a,b){return a-b;})):chosen===item.a;
      var qEl=$("q"+qi);
      qEl.classList.add("q--graded");
      var correctSet=isMulti?item.a:[item.a];
      var chosenSet=isMulti?chosen:[chosen];
      Array.prototype.forEach.call(qEl.querySelectorAll(".opt"),function(lab){
        var oi=parseInt(lab.dataset.o,10);
        if(correctSet.indexOf(oi)!==-1) lab.classList.add("opt--right");
        else if(chosenSet.indexOf(oi)!==-1) lab.classList.add("opt--wrong");
      });
      if(correct) right++;
    });

    var total=lvl.questions.length;
    var passed=right>=lvl.passScore;
    $("score-n").innerHTML=right+" <em>/ "+total+"</em>";
    $("score-msg").textContent=passed
      ?"Passed! You scored above the "+lvl.passScore+"/"+total+" threshold — you can now issue your certificate."
      :"Not yet — you need "+lvl.passScore+"/"+total+" to pass. Review the explanations below and retake when ready.";

    if(passed){
      try{
        sessionStorage.setItem("agenticed_certs:pending:"+levelId,JSON.stringify({score:right,total:total,when:Date.now()}));
      }catch(e){}
      $("score-next").innerHTML='<a class="btn btn--primary" href="certificate.html?level='+levelId+'">Get your certificate →</a>';
    } else {
      $("score-next").innerHTML='<a class="btn btn--ghost" href="index.html">← Back to all certifications</a>';
    }

    try{
      var rec=getRec()||{best:0,attempts:0};
      rec.attempts++;
      rec.best=Math.max(rec.best,right);
      rec.total=total;
      rec.last=right;
      rec.when=Date.now();
      localStorage.setItem(KEY,JSON.stringify(rec));
    }catch(e){}
    showStatus();

    $("score").style.display="block";
    $("grade").style.display="none";
    $("retake").style.display="";
    $("score").scrollIntoView({behavior:"smooth",block:"center"});
  });
  $("retake").addEventListener("click",render);
})();
</script>
</body>
</html>
