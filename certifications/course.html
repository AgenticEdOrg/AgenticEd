<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prep Course — AgenticEd Certifications</title>
  <meta name="description" content="Free prep course for an AgenticEd certification exam — in-depth lessons, hands-on labs, and practice questions."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="certifications.css"/>
  <style>
    .aligned{font-size:12.5px;color:rgba(250,249,255,0.6);margin-top:14px;max-width:700px;}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--warm);}
    .toolbar b{color:var(--brown);}
    .toolbar__links{display:flex;gap:16px;flex-wrap:wrap;}
    .toolbar__links a,.toolbar__links button{background:none;border:none;padding:0;font:inherit;font-weight:600;color:var(--coral);cursor:pointer;text-decoration:none;}
    .toolbar__links a:hover,.toolbar__links button:hover{text-decoration:underline;}
    .progress{height:8px;border-radius:999px;background:var(--light);overflow:hidden;margin:8px 0 22px;}
    .progress__bar{height:100%;width:0%;background:linear-gradient(90deg,var(--coral),var(--amber));border-radius:999px;transition:width .25s ease;}
    .mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:24px;}
    .mod-tab{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:11px 13px;cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;color:var(--brown);line-height:1.35;transition:border-color .14s,transform .14s;}
    .mod-tab:hover{border-color:var(--coral);transform:translateY(-1px);}
    .mod-tab--active{border-color:var(--coral);background:var(--coral-light);}
    .mod-tab__n{flex-shrink:0;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:var(--light);color:var(--warm);}
    .mod-tab--done .mod-tab__n{background:var(--good-bg);color:var(--good);}
    .module__eye{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--coral);margin-bottom:4px;}
    .module__h{font-family:'Outfit',sans-serif;font-size:28px;font-weight:800;line-height:1.2;margin-bottom:6px;}
    .module__domain{font-size:13px;color:var(--warm);margin-bottom:18px;}
    .box{background:var(--cream);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin:18px 0;}
    .box--accent{border-left:4px solid var(--coral);border-radius:0 12px 12px 0;}
    .box--warn{border-left:4px solid var(--bad);border-radius:0 12px 12px 0;background:#FFF8F6;}
    .box--lab{border-left:4px solid var(--good);border-radius:0 12px 12px 0;background:#F6FBF8;}
    .box h3{font-family:'Outfit',sans-serif;font-size:16px;font-weight:800;margin-bottom:8px;}
    .box ul,.box ol{padding-left:20px;font-size:14.5px;}
    .box li{margin-bottom:4px;}
    .lesson h3.sec{font-family:'Outfit',sans-serif;font-size:20px;font-weight:800;margin:30px 0 10px;padding-top:6px;border-top:1px solid var(--border);}
    .lesson h3.sec:first-child{border-top:none;margin-top:10px;}
    .lesson p{font-size:15.5px;margin-bottom:12px;}
    .lesson ul,.lesson ol{padding-left:22px;margin-bottom:12px;font-size:15.5px;}
    .lesson li{margin-bottom:6px;}
    .lesson pre{background:#151827;color:#E7E5F5;border-radius:10px;padding:14px 16px;overflow-x:auto;font-size:13px;line-height:1.55;margin:12px 0 16px;}
    .lesson code{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace;}
    .lesson .tbl{width:100%;border-collapse:collapse;margin:12px 0 16px;font-size:14px;display:block;overflow-x:auto;}
    .lesson .tbl th,.lesson .tbl td{border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top;}
    .lesson .tbl th{background:var(--light);font-weight:700;}
    .lesson .note{background:#FFFBEF;border-left:4px solid var(--amber);border-radius:0 8px 8px 0;padding:12px 16px;margin:14px 0;font-size:14.5px;}
    .check h3{font-family:'Outfit',sans-serif;font-size:20px;font-weight:800;margin:30px 0 4px;}
    .check__sub{font-size:13px;color:var(--warm);margin-bottom:12px;}
    .q{border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px;}
    .q__text{font-size:15px;font-weight:600;margin-bottom:10px;}
    .opt{display:block;width:100%;text-align:left;background:var(--cream);border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px;cursor:pointer;font-family:'Inter',sans-serif;font-size:14.5px;color:var(--brown);transition:border-color .14s;}
    .opt:hover{border-color:var(--coral);}
    .q--answered .opt{cursor:default;pointer-events:none;}
    .opt--right{border-color:var(--good)!important;background:var(--good-bg)!important;}
    .opt--wrong{border-color:var(--bad)!important;background:var(--bad-bg)!important;}
    .why{display:none;margin-top:6px;background:#FFFBEF;border-left:4px solid var(--amber);border-radius:0 8px 8px 0;padding:10px 14px;font-size:14px;}
    .why b{color:#996600;}
    .q--answered .why{display:block;}
    .nav-row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:24px;}
    .done-card{display:none;background:linear-gradient(135deg,var(--brown),#1D2240);border-radius:18px;padding:28px 30px;margin-top:24px;box-shadow:var(--shadow-lg);}
    .done-card h2{font-family:'Outfit',sans-serif;font-size:24px;font-weight:900;color:var(--cream);margin-bottom:8px;}
    .done-card p{font-size:15px;color:rgba(250,249,255,0.78);margin-bottom:18px;}
    #print-view{display:none;}
    @media print{
      body{background:#fff;}
      .topbar,.lhdr,.body,.lesson-footer{display:none!important;}
      #print-view{display:block!important;padding:0 6mm;font-size:11pt;}
      .print-cover{page-break-after:always;padding-top:40mm;}
      .print-cover h1{font-family:'Outfit',sans-serif;font-size:28pt;font-weight:900;margin-bottom:8mm;}
      .print-cover p{margin-bottom:4mm;}
      .print-module{page-break-before:always;}
      .lesson pre{background:#f3f3f6;color:#111;white-space:pre-wrap;}
      .lesson .tbl{display:table;}
      .q,.box,.lesson pre,.lesson .tbl tr{page-break-inside:avoid;}
      .why{display:block;}
      .opt{border:1px solid #ccc;}
    }
  </style>
  <script src="cert-data.js?v=20261024"></script>
  <script src="course-foundational.js?v=20261024"></script>
  <script src="course-associate.js?v=20261024"></script>
  <script src="course-advanced.js?v=20261024"></script>
  <link rel="icon" type="image/png" href="images/favicon.png"/>
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png"/>
  <style>.brand-mark{display:inline-block;height:1.6em;width:auto;vertical-align:middle;margin:-.2em .45em 0 0;}</style>
</head>
<body>
<div class="topbar">
  <a href="index.html" class="topbar__logo"><img class="brand-mark" src="images/agenticed-mark.png" alt="" aria-hidden="true"/>AgenticEd <em>Certifications</em></a>
  <a href="index.html" class="back">← All certifications</a>
</div>
<div class="lhdr">
  <div class="lhdr__inner">
    <p class="lhdr__eye" id="eye">Prep Course</p>
    <h1 class="lhdr__h1" id="title">Prep Course</h1>
    <p class="lhdr__sub" id="intro"></p>
    <div class="lhdr__stats" id="stats"></div>
    <p class="aligned" id="aligned"></p>
  </div>
</div>
<div class="body">
  <div class="toolbar">
    <span id="progress-text"></span>
    <span class="toolbar__links">
      <button type="button" id="pdf-btn">Download study guide (PDF)</button>
      <a href="#" id="exam-link">Go to the exam →</a>
    </span>
  </div>
  <div class="progress"><div class="progress__bar" id="progress-bar"></div></div>
  <div class="mods" id="mods"></div>
  <div class="card" id="module"></div>
  <div class="done-card" id="done">
    <h2>Course complete. You're ready for the exam.</h2>
    <p id="done-msg"></p>
    <a class="btn btn--primary" id="done-btn" href="#">Start exam →</a>
  </div>
</div>
<div id="print-view"></div>
<div class="lesson-footer">
  <a href="index.html" class="lesson-footer__logo"><img class="brand-mark" src="images/agenticed-mark.png" alt="" aria-hidden="true"/>AgenticEd <em>Certifications</em></a>
  <div style="display:flex;gap:20px;">
    <a href="index.html">← All certifications</a>
    <a href="mailto:hello@agenticed.org">hello@agenticed.org</a>
  </div>
</div>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var certs=window.AGENTICED_CERTS;
  var courses=window.AGENTICED_COURSES;
  var params=new URLSearchParams(location.search);
  var levelId=params.get("level");
  if(!courses[levelId]) levelId=certs.order[0];
  var lvl=certs.levels[levelId];
  var course=courses[levelId];
  var mods=course.modules;
  var KEY="agenticed_certs:course:"+levelId;
  var examHref="exam.html?level="+levelId;

  document.title=course.title+" Prep Course — AgenticEd Certifications";
  $("eye").textContent=lvl.tier+" · Prep Course";
  $("title").textContent=course.title;
  $("intro").textContent=course.intro;
  $("aligned").textContent=course.alignedWith||"";
  var minutes=mods.reduce(function(s,m){return s+m.minutes;},0);
  var labs=mods.filter(function(m){return m.lab;}).length;
  var practice=mods.reduce(function(s,m){return s+m.check.length;},0);
  $("stats").innerHTML='<span class="lhdr__stat">'+mods.length+' modules</span>'+
    '<span class="lhdr__stat">About '+(Math.round(minutes/30)/2)+' hours</span>'+
    '<span class="lhdr__stat">'+labs+' hands-on labs</span>'+
    '<span class="lhdr__stat">'+practice+' practice questions</span>';
  $("exam-link").href=examHref;
  $("done-btn").href=examHref;
  $("done-msg").textContent="You've worked through every module. The exam is "+lvl.total+" questions and you need "+lvl.passScore+" correct to pass.";

  function getDone(){
    try{var rec=JSON.parse(localStorage.getItem(KEY)||"null");return rec&&rec.done?rec.done:[];}catch(e){return [];}
  }
  function setDone(done){
    try{localStorage.setItem(KEY,JSON.stringify({done:done,total:mods.length,when:Date.now()}));}catch(e){}
  }
  function indexFromHash(){
    var id=location.hash.replace("#","");
    for(var i=0;i<mods.length;i++) if(mods[i].id===id) return i;
    return -1;
  }

  var current=indexFromHash();
  if(current<0){
    var done=getDone();
    current=0;
    for(var i=0;i<mods.length;i++){ if(done.indexOf(mods[i].id)===-1){current=i;break;} }
  }

  function list(items,ordered){
    var tag=ordered?"ol":"ul";
    return "<"+tag+">"+items.map(function(t){return "<li>"+t+"</li>";}).join("")+"</"+tag+">";
  }

  /* Module body shared by the interactive view and the printable study guide. */
  function moduleBody(m,i,showAnswers){
    var html='<p class="module__eye">Module '+(i+1)+' of '+mods.length+' · about '+m.minutes+' min</p>'+
      '<h2 class="module__h">'+m.title+'</h2>'+
      (m.domain?'<p class="module__domain">Domain: '+m.domain+'</p>':'')+
      '<div class="box box--accent"><h3>Learning objectives</h3>'+list(m.objectives)+'</div>'+
      '<div class="lesson">'+m.sections.map(function(s){return '<h3 class="sec">'+s.h+'</h3>'+s.html;}).join("")+'</div>';
    if(m.pitfalls&&m.pitfalls.length) html+='<div class="box box--warn"><h3>Common mistakes</h3>'+list(m.pitfalls)+'</div>';
    html+='<div class="box box--accent"><h3>Key takeaways</h3>'+list(m.takeaways)+'</div>';
    if(m.lab) html+='<div class="box box--lab"><h3>Hands-on lab: '+m.lab.title+'</h3>'+list(m.lab.steps,true)+'</div>';
    html+='<div class="check"><h3>Check your understanding</h3>'+
      (showAnswers?'':'<p class="check__sub">Practice questions. Pick an answer to see the explanation. These don\'t count toward your exam.</p>');
    m.check.forEach(function(item,qi){
      html+='<div class="q'+(showAnswers?' q--answered':'')+'" id="cq'+qi+'"><div class="q__text">'+(qi+1)+'. '+item.q+'</div>';
      item.opts.forEach(function(opt,oi){
        html+='<button class="opt'+(showAnswers&&oi===item.a?' opt--right':'')+'" data-q="'+qi+'" data-o="'+oi+'">'+opt+'</button>';
      });
      html+='<div class="why"><b>Why:</b> '+item.why+'</div></div>';
    });
    return html+'</div>';
  }

  function renderProgress(){
    var done=getDone();
    var n=mods.filter(function(m){return done.indexOf(m.id)!==-1;}).length;
    $("progress-text").innerHTML="<b>"+n+" / "+mods.length+"</b> modules complete";
    $("progress-bar").style.width=Math.round(n/mods.length*100)+"%";
    var html="";
    mods.forEach(function(m,i){
      var isDone=done.indexOf(m.id)!==-1;
      var cls="mod-tab"+(isDone?" mod-tab--done":"")+(i===current?" mod-tab--active":"");
      html+='<button class="'+cls+'" data-i="'+i+'"><span class="mod-tab__n">'+(isDone?"✓":(i+1))+'</span><span>'+m.title+'</span></button>';
    });
    $("mods").innerHTML=html;
    Array.prototype.forEach.call(document.querySelectorAll(".mod-tab"),function(b){
      b.addEventListener("click",function(){go(parseInt(b.dataset.i,10));});
    });
    $("done").style.display=n===mods.length?"block":"none";
  }

  function renderModule(){
    var m=mods[current];
    var isLast=current===mods.length-1;
    $("module").innerHTML=moduleBody(m,current,false)+
      '<div class="nav-row">'+
      (current>0?'<button class="btn btn--ghost" id="prev">← Previous</button>':'<span></span>')+
      '<button class="btn btn--primary" id="next">'+(isLast?"Mark complete":"Mark complete and continue →")+'</button></div>';

    Array.prototype.forEach.call(document.querySelectorAll("#module .opt"),function(b){
      b.addEventListener("click",function(){
        var qi=parseInt(b.dataset.q,10), oi=parseInt(b.dataset.o,10);
        var item=m.check[qi];
        var qEl=$("cq"+qi);
        qEl.classList.add("q--answered");
        Array.prototype.forEach.call(qEl.querySelectorAll(".opt"),function(x){
          var xi=parseInt(x.dataset.o,10);
          if(xi===item.a) x.classList.add("opt--right");
          else if(xi===oi) x.classList.add("opt--wrong");
        });
      });
    });
    if($("prev")) $("prev").addEventListener("click",function(){go(current-1);});
    $("next").addEventListener("click",function(){
      var done=getDone();
      if(done.indexOf(m.id)===-1){done.push(m.id);setDone(done);}
      if(isLast){
        renderProgress();
        $("done").scrollIntoView({behavior:"smooth",block:"center"});
      } else {
        go(current+1);
      }
    });
  }

  function go(i){
    current=i;
    history.replaceState(null,"","#"+mods[i].id);
    renderProgress();
    renderModule();
    $("mods").scrollIntoView({behavior:"smooth",block:"start"});
  }

  /* Study guide: the whole course with answers shown, sent to the browser's print dialog ("Save as PDF"). */
  $("pdf-btn").addEventListener("click",function(){
    var html='<div class="print-cover"><p class="module__eye">AgenticEd Certifications · '+lvl.tier+'</p>'+
      '<h1>'+course.title+'<br/>Study Guide</h1>'+
      '<p>'+course.intro+'</p>'+
      (course.alignedWith?'<p style="color:#666;font-size:10pt;">'+course.alignedWith+'</p>':'')+
      '<h3 style="margin-top:8mm;">Contents</h3>'+list(mods.map(function(m){return m.title+" ("+m.minutes+" min)";}),true)+
      '<p style="margin-top:8mm;color:#666;font-size:10pt;">Exam: '+lvl.name+' · '+lvl.total+' questions · '+lvl.passScore+' correct to pass · agenticedacademy.com/certifications</p></div>';
    mods.forEach(function(m,i){ html+='<div class="print-module">'+moduleBody(m,i,true)+'</div>'; });
    $("print-view").innerHTML=html;
    window.print();
  });

  renderProgress();
  renderModule();
})();
</script>
</body>
</html>
